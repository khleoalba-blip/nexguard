<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexGuard — Actualizaciones</title>
<style>
  body{margin:0;background:#0b0b0f;color:#eee;font:18px system-ui;display:grid;min-height:100vh;place-items:center}
  main{max-width:640px;padding:48px}
  h1{font-size:48px;color:#c574ff;margin:0 0 16px}
  p{line-height:1.6;color:#c3bccd}
  a{color:#fff;background:linear-gradient(100deg,#683be8,#c31534);padding:14px 24px;border-radius:12px;text-decoration:none;display:inline-block}
  a[hidden]{display:none}
  small{display:block;margin-top:24px;color:#aaa;line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>NexGuard</h1>
  <p>Actualizaciones para Android y Android TV.</p>
  <p id="version">Comprobando la última versión…</p>
  <a id="download" href="#" hidden>Descargar APK</a>
  <small>También puedes actualizar desde E. DEPORTIVOS → Ajustes → Actualizaciones nexguard.</small>
</main>
<script>
  const versionEl = document.querySelector("#version");
  const downloadEl = document.querySelector("#download");

  fetch("/ota/nexguard.json", { cache: "no-store" })
    .then((r) => {
      if (!r.ok) throw new Error("OTA no disponible");
      return r.json();
    })
    .then((v) => {
      const u = new URL(v.url, location.origin);
      if (u.origin !== location.origin) throw new Error("Origen no permitido");
      if (!/^\/releases\/nexguard-[1-9][0-9]*\.apk$/.test(u.pathname)) {
        throw new Error("Ruta no permitida");
      }
      versionEl.textContent = `Versión ${v.versionName} — ${v.versionCode}`;
      downloadEl.href = u.href;
      downloadEl.hidden = false;
    })
    .catch(() => {
      versionEl.textContent = "La próxima actualización estará disponible aquí.";
    });
</script>
</body>
</html>
